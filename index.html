    <aside>
        <div id="moves">
            <!-- 
                A move is built like this:
                - create a <button></button> element,
                - add the name of the move in the button like so:
                    <button>F<button>
                - then add the value following this pattern:
                    {name of the face*} {direction} {number of rotation}
                    each value must be separate by a space!
                (*accordingly to the Array 'layers' in layerHandler.js)
            -->
            <div class="slider">
                <div>
                    <div>clockwise moves</div>
                    <div>
                        <button value="frontLayer 1 1">F</button>
                        <button value="backLayer -1 1">B</button>
                        <button value="leftLayer -1 1">L</button>
                        <button value="rightLayer 1 1">R</button>
                        <button value="upperLayer -1 1">U</button>
                        <button value="downLayer 1 1">D</button>
                        <button value="middleLayer -1 1">M</button>
                        <button value="equatorLayer 1 1">E</button>
                        <button value="standingLayer 1 1">S</button>
                    </div>
                </div>
                <div>
                    <div>counter-clockwise moves</div>
                    <div>
                        <button value="frontLayer -1 1">F'</button>
                        <button value="backLayer 1 1">B'</button>
                        <button value="leftLayer 1 1">L'</button>
                        <button value="rightLayer -1 1">R'</button>
                        <button value="upperLayer 1 1">U'</button>
                        <button value="downLayer -1 1">D'</button>
                        <button value="middleLayer 1 1">M'</button>
                        <button value="equatorLayer -1 1">E'</button>
                        <button value="standingLayer -1 1">S'</button>
                    </div>
                </div>
                <!--
                    For special move, we use a
                    combination of already existing moves,
                    the build remain the same.
                -->
                <div>
                    <div>cube rotations</div>
                    <div>
                        <button value="rightLayer middleLayer leftLayer 1 1 1 1 1 1">x</button>
                        <button value="upperLayer equatorLayer downLayer -1 -1 -1 1 1 1">y</button>
                        <button value="frontLayer standingLayer backLayer 1 1 1 1 1 1">z</button>
                        <button value="rightLayer middleLayer leftLayer -1 -1 -1 1 1 1">x'</button>
                        <button value="upperLayer equatorLayer downLayer 1 1 1 1 1 1">y'</button>
                        <button value="frontLayer standingLayer backLayer -1 -1 -1 1 1 1">z'</button>
                    </div>
                </div>
                <div>
                    <div>wide moves</div>
                    <div>
                        <button value="upperLayer equatorLayer -1 -1 1 1">u</button>
                        <button value="downLayer equatorLayer 1 1 1 1">d</button>
                        <button value="rightLayer middleLayer 1 1 1 1">r</button>
                        <button value="leftLayer middleLayer -1 -1 1 1">l</button>
                        <button value="frontLayer standingLayer 1 1 1 1">f</button>
                        <button value="backLayer standingLayer -1 -1 1 1">b</button>
                    </div>
                </div>
                
                <div>
                    <div>wide counter-clockwise moves</div>
                    <div>
                        <button value="upperLayer equatorLayer 1 1 1 1">u'</button>
                        <button value="downLayer equatorLayer -1 -1 1 1">d'</button>
                        <button value="rightLayer middleLayer -1 -1 1 1">r'</button>
                        <button value="leftLayer middleLayer 1 1 1 1">l'</button>
                        <button value="frontLayer standingLayer -1 -1 1 1">f'</button>
                        <button value="backLayer standingLayer 1 1 1 1">b'</button>
                    </div>
                </div>
                <div>
                    <div>double moves</div>

                        <button value="middleLayer -1 2">M2</button>
                        <button value="equatorLayer 1 2">E2</button>
                        <button value="standingLayer 1 2">S2</button>
                    </div>
                </div>
