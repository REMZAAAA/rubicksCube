<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rubik's cube</title>
    <link rel="stylesheet" href="./css/animation.css">
    <link rel="stylesheet" href="./css/history.css">
    <link rel="stylesheet" href="./css/sidebar.css">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/tools.css">
    <link rel="stylesheet" href="./css/canvas.css">
</head>
<body>

    <main>
        <div id="tools">
            <a href="https://github.com/REMZAAAA/rubicksCube">GITHUB</a>
        </div>
        <div id="history"></div>
        <div id="sidebar">
            <div id="controls">
                <div class="moves"></div>
                <div class="resolve"></div>
            </div>

            <div id="commands">
                <button class="reset">RESET CUBE</button>
                <button class="shuffle">⇆</button>
                <button class="resolve">🪄</button>
            </div>
        </div>
        <div id="canvas">
            <div id="mainCube" class=""></div>
            <div id="menu">
                <aside>
                    <span></span>
                    <span></span>
                    <input type="checkbox">
                </aside>

                <div class="colors">
                    <input type="color">
                    <input type="color">
                    <input type="color">
                    <input type="color">
                    <input type="color">
                    <input type="color">
                </div>

                <div class="resetColor">
                    <button>reset color</button>
                </div>

                <div class="debug">
                    <input type="checkbox">
                    debug mode
                </div>
            </div>
        </div>
    </main>
